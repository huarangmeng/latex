# Mainline publishes the standard version only.
# Kotlin 2.1 compatibility ends at 1.6.3-kt2.1.0; its legacy publishing
# workflow is preserved on the release-1.6.3 branch.
# The aggregate task also publishes the optional latex-fonts-katex module.

name: Publish
on:
  release:
    types: [released, prereleased]
  workflow_dispatch:

jobs:
  publish:
    name: "📦 Publish normal version"
    runs-on: macOS-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'

      - name: Get VERSION from gradle.properties
        run: |
          VERSION=$(grep '^VERSION=' gradle.properties | cut -d'=' -f2)
          echo ""
          echo "╔══════════════════════════════════════╗"
          echo "║  📦 正常发布                          ║"
          echo "╠══════════════════════════════════════╣"
          echo "║  VERSION = $VERSION"
          echo "║"
          echo "║  将发布:"
          echo "║    io.github.huarangmeng:latex-base:$VERSION"
          echo "║    io.github.huarangmeng:latex-parser:$VERSION"
          echo "║    io.github.huarangmeng:latex-renderer:$VERSION"
          echo "║    io.github.huarangmeng:latex-fonts-katex:$VERSION (可选字体)"
          echo "╚══════════════════════════════════════╝"

      - name: Publish to MavenCentral
        run: ./gradlew publishAllPublicationsToMavenCentralRepository --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
