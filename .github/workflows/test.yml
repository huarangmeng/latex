name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # 单元测试是门禁：执行全仓 JVM 测试，任何测试失败都会使工作流失败。
  unit-tests:
    name: 全量 JVM 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: 缓存 Gradle 构建状态
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: 授予 Gradle 执行权限
        run: chmod +x ./gradlew

      - name: 验证性能报告的评判规则
        run: python3 -m unittest discover -s latex-benchmark -p 'test_report_performance.py'

      - name: 运行全仓 JVM 单元测试
        run: ./gradlew jvmTest --console=plain

      - name: 保存单元测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 14

  browser-tests:
    name: 浏览器单元测试（${{ matrix.target }}）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: jsBrowserTest
            compiler: Js
          - target: wasmJsBrowserTest
            compiler: WasmJs
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: 缓存 Gradle 与浏览器工具链
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          gradle-home-cache-includes: |
            caches
            notifications
            nodejs
            yarn

      - name: 缓存 NPM 依赖
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/latex-yarn-cache
          key: ${{ runner.os }}-yarn-${{ matrix.compiler }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: ${{ runner.os }}-yarn-${{ matrix.compiler }}-

      - name: 编译并运行平台回归测试
        env:
          YARN_CACHE_FOLDER: ${{ runner.temp }}/latex-yarn-cache
        run: |
          chmod +x ./gradlew
          CHROME_BIN="$(command -v google-chrome)"
          export CHROME_BIN
          ./gradlew \
            :latex-parser:compileTestKotlin${{ matrix.compiler }} \
            :latex-renderer:${{ matrix.target }} \
            --console=plain
          # 确认关键跨平台测试确实执行，避免源集或运行器配置变化导致漏测。
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          target = "${{ matrix.target }}"
          reports = [ET.parse(report).getroot() for report in
                     Path("latex-renderer/build/test-results", target).glob("TEST-*.xml")]
          required = (("LayoutIdentityTest", 2), ("FontResourceCacheTest", 3),
                      ("VerticalDelimiterGeometryTest", 2), ("SvgCanvasTest", 1))
          for test_class, minimum in required:
              count = sum(int(report.get("tests", 0)) for report in reports
                          if test_class in report.get("name", ""))
              if count < minimum:
                  raise SystemExit(f"{target}: {test_class} 预期至少 {minimum} 项，实际 {count}")
              print(f"{target}: {test_class} 已执行 {count} 项测试")
          PY

      - name: 保存浏览器测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-reports-${{ matrix.compiler }}
          path: |
            latex-renderer/build/reports/tests/${{ matrix.target }}/**
            latex-renderer/build/test-results/${{ matrix.target }}/**
          retention-days: 14

  # 性能仅报告 GOOD/BAD，不作合入门禁；采样异常仍保留失败步骤、警告和产物。
  performance:
    name: 全链路性能报告（CI 代表集）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: 缓存 Gradle 构建状态
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: 授予 Gradle 执行权限
        run: chmod +x ./gradlew

      - name: 运行 JMH 并采集 GC 分配指标
        run: |
          mkdir -p latex-benchmark/build/reports/performance
          ./gradlew :latex-benchmark:performanceBenchmark \
            -PbenchmarkProfile=ci \
            -PbenchmarkGc=true --console=plain 2>&1 \
            | tee latex-benchmark/build/reports/performance/benchmark.log

      - name: 生成 GOOD/BAD 报告并写入运行摘要
        if: always()
        run: |
          report_json=latex-benchmark/build/reports/performance/jmh.json
          report_md=latex-benchmark/build/reports/performance/summary.md
          if [[ -s "$report_json" ]]; then
            python3 latex-benchmark/report_performance.py "$report_json" --output "$report_md"
            cat "$report_md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::warning::未生成 JMH 结果，请查看性能采样日志。'
            echo '性能采样未生成结果，请查看日志与报告附件。' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 标记性能工具异常
        if: failure()
        run: echo '::warning::性能采样或报告生成失败；该任务不拦截合入，请检查日志与附件。'

      - name: 保存性能结果、报告与采样日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: latex-benchmark/build/reports/**
          retention-days: 30
