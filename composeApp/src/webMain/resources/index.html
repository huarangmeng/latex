<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Try the Kotlin Multiplatform LaTeX library: interactive math rendering, chemical formulas, incremental updates, and a live editor.">
    <meta name="theme-color" content="#faf9fd">
    <title>LaTeX · Interactive Demo</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
<header class="demo-header">
    <span class="brand">LaTeX <span class="subtitle">Interactive demo</span></span>
    <a href="https://github.com/huarangmeng/latex" target="_blank" rel="noopener noreferrer">View on GitHub ↗</a>
</header>
<main id="compose-root" aria-label="Interactive LaTeX preview">
    <!-- Compose replaces this fallback with its shadow DOM once the app starts. -->
    <div class="loading" role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <h1>LaTeX, live in your browser.</h1>
        <p id="loading-message">Loading the interactive preview. The first visit may take a moment.</p>
        <p class="hint">Use a current browser with WebAssembly GC support.</p>
        <noscript><p>Enable JavaScript to explore the interactive demo.</p></noscript>
    </div>
</main>
<script src="./demo.js"></script>
<script src="./composeApp.js" defer></script>
</body>
</html>
